# ARTEX 원본 docker-compose.yml 위에 덮어쓰는 override.
# 원본은 건드리지 않고,
#   - 웹/프록시 포트를 127.0.0.1 로만 바인딩하고
#   - 기본 네트워크 브리지 이름을 br-artex 로 고정한다 (lab-firewall.sh 가 이 이름으로 egress 를 막음).
# 사용: docker compose -f ARTEX/docker-compose.yml -f artex.lab.yml up -d
services:
  artex:
    ports: !override
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
networks:
  default:
    driver_opts:
      com.docker.network.bridge.name: br-artex
